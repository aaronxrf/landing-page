name: Refresh family-doctors data

on:
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install openpyxl
        run: python3 -m pip install --quiet openpyxl
      - name: Fetch NVD spreadsheets + rebuild map data
        run: |
          rc=0
          python3 GAK/fetch_nvd.py || rc=$?
          echo "fetch_rc=$rc" >> "$GITHUB_ENV"
          if [ "$rc" -ne 0 ]; then
            echo "::warning::fetch_nvd.py failed (rc=$rc) — building map from committed xlsx"
          fi
          python3 GAK/build.py
      - name: Commit updated snapshot
        uses: stefanzweifel/git-auto-commit-action@v7.2.0
        with:
          commit_message: "chore: refresh family-doctors map data"
          file_pattern: GAK/docs/doctors.json GAK/geocode_cache.json GAK/*.xlsx
      - name: Fail when refresh was not possible
        if: env.fetch_rc != '0'
        run: |
          if ls GAK/*_gimenes_arsti_*.xlsx >/dev/null 2>&1; then
            echo "::warning::NVD fetch failed (rc=${{ env.fetch_rc }}) — map refreshed from committed xlsx."
          else
            echo "::error::NVD fetch failed (rc=${{ env.fetch_rc }}) and no committed xlsx fallback exists."
            exit 1
          fi
